apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  replicas: {{ .Values.replicaCount.dashboard }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-dashboard }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-dashboard } }
    spec:
      # Hardened pod security: non-root, no priv-esc, default seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dashboard
          image: {{ .Values.image.dashboard | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Hardened container security context (Next.js writes its cache, so
          # readOnlyRootFilesystem is omitted).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          # Container always listens on 3000 (Next.js standalone default).
          # Service exposes service.dashboardPort externally.
          ports: [{ containerPort: 3000 }]
          # Only non-sensitive config — the dashboard never needs the app secrets
          # (DB/JWT/secrets-key), so they are deliberately NOT injected here.
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources: {{- toYaml .Values.resources.dashboard | nindent 12 }}
          livenessProbe:  { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 5,  periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-dashboard }
spec:
  type: {{ .Values.service.type }}
  selector: { app: {{ .Release.Name }}-dashboard }
  ports: [{ port: {{ .Values.service.dashboardPort }}, targetPort: 3000 }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: {}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-{{ .service }}
                port: { number: {{ if eq .service "api" }}{{ $.Values.service.apiPort }}{{ else }}{{ $.Values.service.dashboardPort }}{{ end }} }
          {{- end }}
    {{- end }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
{{- end }}
