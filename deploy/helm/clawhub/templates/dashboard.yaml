apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
spec:
  replicas: {{ .Values.replicaCount.dashboard }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-dashboard }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-dashboard } }
    spec:
      containers:
        - name: dashboard
          image: {{ .Values.image.dashboard | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3001 }]
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources: {{- toYaml .Values.resources.dashboard | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-dashboard }
spec:
  type: {{ .Values.service.type }}
  selector: { app: {{ .Release.Name }}-dashboard }
  ports: [{ port: {{ .Values.service.dashboardPort }}, targetPort: 3001 }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: {}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-{{ .service }}
                port: { number: {{ if eq .service "api" }}{{ $.Values.service.apiPort }}{{ else }}{{ $.Values.service.dashboardPort }}{{ end }} }
          {{- end }}
    {{- end }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
{{- end }}
