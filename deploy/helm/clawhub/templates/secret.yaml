# Sensitive app config as a Kubernetes Secret — keeps JWT_SECRET,
# CLAWHUB_SECRETS_KEY, DATABASE_URL, REDIS_URL out of the plaintext pod spec.
# Consumed by api/dashboard via `envFrom: secretRef` and by the replication/
# backup workers via per-key `valueFrom: secretKeyRef`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-app-secrets
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
