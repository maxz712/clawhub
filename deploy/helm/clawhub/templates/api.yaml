apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-api }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      # Hardened pod security: non-root, no priv-esc, default seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: {{ .Values.image.api | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Hardened container security context. readOnlyRootFilesystem is omitted
          # because the API shells out to git, which writes temp files outside the
          # repos volume.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          ports:
            - containerPort: 3000
          # Non-sensitive config as plain env; secrets injected from the Secret.
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .Release.Name }}-app-secrets }
          volumeMounts:
            - name: repos
              mountPath: /data/repos
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          livenessProbe:  { httpGet: { path: /api/v1/health, port: 3000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 3000 }, initialDelaySeconds: 5,  periodSeconds: 5 }
      volumes:
        - name: repos
          {{- if .Values.persistence.repos.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-repos
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: {{ .Values.service.type }}
  selector: { app: {{ .Release.Name }}-api }
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: 3000
{{- if .Values.persistence.repos.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-repos
spec:
  accessModes: [ {{ .Values.persistence.repos.accessMode }} ]
  {{- with .Values.persistence.repos.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.repos.size }}
{{- end }}
