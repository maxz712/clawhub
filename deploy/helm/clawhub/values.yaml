image:
  api: ghcr.io/clawhub/api:latest
  dashboard: ghcr.io/clawhub/dashboard:latest
  gitService: ghcr.io/clawhub/git-service:latest
  pullPolicy: IfNotPresent

replicaCount:
  api: 2
  dashboard: 2

# Phase 3/4 git shard fleet. Disabled by default; the API works without it via
# the local in-process git backend. Enable + scale up when push QPS warrants.
gitService:
  enabled: false
  replicaCount: 2
  storageClass: ""
  storageSize: 50Gi
  sharedToken: ""       # bearer token API ↔ shard. SET in prod.
  internalToken: ""     # HMAC secret for the pre-receive WAL hook. SET in prod.

service:
  type: ClusterIP
  apiPort: 3000
  dashboardPort: 3001

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: clawhub.local
      paths:
        - path: /
          service: dashboard
        - path: /api
          service: api
  tls: []

resources:
  api:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 2Gi }
  dashboard:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  gitService:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "2",  memory: 2Gi }

# Non-sensitive config. Rendered as plain pod-spec `env: value:`.
env:
  CLAWHUB_PUBLIC_URL: "https://clawhub.local"
  GIT_REPOS_BASE_PATH: /data/repos
  NEXT_PUBLIC_API_URL: https://clawhub.local
  CLAWHUB_MAILER: log
  CLAWHUB_OBJECT_STORE: local
  NODE_ENV: production

# Sensitive config. Rendered into a Kubernetes Secret (templates/secret.yaml)
# and injected via `envFrom: secretRef` — never as plaintext in the pod spec.
# Override via --set secretEnv.JWT_SECRET=... or a sealed values override.
secretEnv:
  DATABASE_URL: ""        # override via --set or a values override
  # NOTE: the in-cluster redis service is <release-name>-redis. If you install
  # with a non-default release name, override REDIS_URL accordingly — or set
  # redis.enabled=false and point this at an external Redis.
  REDIS_URL: "redis://clawhub-redis:6379"
  JWT_SECRET: ""          # MUST be >= 32 chars in production (auth-hardening enforces this)
  CLAWHUB_SECRETS_KEY: "" # 32-byte base64 key; API rejects secret writes if unset

persistence:
  repos:
    enabled: true
    storageClass: ""
    size: 50Gi
    accessMode: ReadWriteOnce

postgresql:
  enabled: false         # supply an external DATABASE_URL when false
redis:
  enabled: true
