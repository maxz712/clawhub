groups:
  - name: clawhub.api
    interval: 30s
    rules:
      - alert: ClawHubApiDown
        expr: up{job="clawhub-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "ClawHub API instance is down"
          description: "{{ $labels.instance }} has been unavailable for 2m."

      - alert: ClawHubHigh5xxRate
        expr: sum(rate(clawhub_http_requests_total{status=~"5.."}[5m])) / sum(rate(clawhub_http_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "5xx rate above 5% for 10m"

      - alert: ClawHubSlowP95
        expr: histogram_quantile(0.95, sum(rate(clawhub_http_request_ms_bucket[5m])) by (le)) > 1500
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency > 1.5s for 15m"

      - alert: ClawHubAgentRateLimitBurst
        expr: sum(rate(clawhub_http_requests_total{status="429"}[5m])) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Sustained 429s — agent or IP flooding the API"

      - alert: ClawHubCiFailureSpike
        expr: sum(rate(clawhub_ci_runs_total{status="failure"}[30m])) > 0.5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "CI failure rate elevated for 30m — investigate recent changes"

      - alert: ClawHubSecretOrVulnFound
        expr: increase(clawhub_sast_findings_total{severity=~"high|critical"}[15m]) > 0 or increase(clawhub_vuln_findings_total{severity=~"high|critical"}[15m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "High/critical security finding ingested"
