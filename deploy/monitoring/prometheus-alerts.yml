groups:
  - name: clawhub.api
    interval: 30s
    rules:
      - alert: ClawHubApiDown
        expr: up{job="clawhub-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "ClawHub API instance is down"
          description: "{{ $labels.instance }} has been unavailable for 2m."

      - alert: ClawHubHigh5xxRate
        expr: sum(rate(clawhub_http_requests_total{status=~"5.."}[5m])) / sum(rate(clawhub_http_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "5xx rate above 5% for 10m"

      - alert: ClawHubSlowP95
        expr: histogram_quantile(0.95, sum(rate(clawhub_http_request_ms_bucket[5m])) by (le)) > 1500
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency > 1.5s for 15m"

      - alert: ClawHubAgentRateLimitBurst
        expr: sum(rate(clawhub_http_requests_total{status="429"}[5m])) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Sustained 429s — agent or IP flooding the API"

      - alert: ClawHubCiFailureSpike
        expr: sum(rate(clawhub_ci_runs_total{status="failure"}[30m])) > 0.5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "CI failure rate elevated for 30m — investigate recent changes"

      - alert: ClawHubSecretOrVulnFound
        expr: increase(clawhub_sast_findings_total{severity=~"high|critical"}[15m]) > 0 or increase(clawhub_vuln_findings_total{severity=~"high|critical"}[15m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "High/critical security finding ingested"

  - name: clawhub.shards
    interval: 30s
    rules:
      - alert: ClawHubShardUnhealthy
        expr: max(clawhub_shard_health) by (shard) == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "git-service shard {{ $labels.shard }} unhealthy for 1m"

      - alert: ClawHubShardCircuitOpen
        expr: max(clawhub_shard_circuit_open) by (shard) == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Circuit breaker open on shard {{ $labels.shard }}"

      - alert: ClawHubFailoverFired
        expr: increase(clawhub_shard_failover_total[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Shard failover happened in the last 5m"

      - alert: ClawHubBackupStale
        expr: time() - max(clawhub_repo_backup_total) > 86400 * 2
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "No successful repo backup observed in the last 48h"

      # #140: ClawHubBackupStale above only sees the ok counter STOP advancing.
      # A backup that snapshots refs and uploads no objects advances it exactly
      # like a real one — that was the failure mode for the feature's whole
      # lifetime, and no metric could see it. This is the dead-man for it.
      - alert: ClawHubBackupNoObjects
        expr: increase(clawhub_repo_backup_empty_total[24h]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "A repo backup uploaded no git objects — it is not restorable"
          description: "backupRepo snapshotted refs but shipped zero packfile objects and has no parent backup to inherit them from. Check the git tier is reachable (repo_backup_complete logs packs/packBytes) and re-run the backup."

      - alert: ClawHubRestoreFailed
        expr: increase(clawhub_repo_restore_total{result!="ok"}[15m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Repo restore failed in the last 15m"
          description: "See the repo_restore_failed log line for the cause: a missing/corrupt pack, a sha256 mismatch, a refs-only (pre-#140) manifest, or a ref that would not write."

  - name: clawhub.memory
    interval: 60s
    rules:
      # Dead-man switch for the memory system: standing runs are dispatching but
      # every pack is empty — memory is silently contributing nothing (the state
      # the system shipped in and nobody noticed).
      - alert: ClawHubMemoryPacksAllEmpty
        expr: >
          increase(clawhub_memory_pack_total{empty="true"}[6h]) > 3
          and increase(clawhub_memory_pack_total{empty="false"}[6h]) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "All memory packs built in the last 6h were empty — agents run with no recalled memory"

      # Agents are running but nothing is ever written back: the write path is
      # broken (auth, schema, or harness regression), not merely quiet.
      - alert: ClawHubMemoryWritesFlatlined
        expr: >
          increase(clawhub_standing_runs_total[24h]) > 5
          and increase(clawhub_memory_writes_total[24h]) == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Standing runs executed in the last 24h but zero memory writes landed"

  - name: clawhub.llm_gateway
    interval: 60s
    rules:
      # Dead-man switch for platform-LLM metering (M3): the gateway is serving
      # requests but usage responses aren't parsing, so token spend is going
      # unmetered — an authoritative-billing correctness bug, not merely noise.
      # M3 exit criterion: this must fire end-to-end in a drill.
      - alert: ClawHubLlmGatewayParseFailures
        expr: increase(clawhub_llm_gateway_parse_fail_total[15m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "LLM gateway failed to parse a usage response — platform token spend may be going unmetered"

      # The gateway is rejecting a high share of requests (bad/expired tokens or
      # an unreachable upstream) — the platform-keyed path is degraded.
      - alert: ClawHubLlmGatewayRejectSpike
        expr: increase(clawhub_llm_gateway_reject_total[15m]) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "LLM gateway is rejecting a high share of requests (auth or upstream failure)"
