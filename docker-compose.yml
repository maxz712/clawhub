services:
  api:
    build:
      context: .
      args:
        # The deploy pipeline sets GIT_SHA to the merge commit; /health
        # then reports exactly what is running.
        GIT_SHA: ${GIT_SHA:-dev}
    # Bound to loopback: the Caddy proxy (profile "proxy") is the public face.
    # Without the proxy this still serves http://localhost:3000 for local use.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    # Containment: the API runs as uid 1000 (`node`, set in the Dockerfile) —
    # chown the git_repos volume to 1000 once before first boot. cap_drop +
    # no-new-privileges keep a compromised process from escalating.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgresql://clawhub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/clawhub
      REDIS_URL: redis://${REDIS_PASSWORD:+default:${REDIS_PASSWORD}@}redis:6379
      # No fallback on purpose: a guessable default signing key on a public
      # endpoint lets anyone mint tokens. Compose refuses to start instead.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      CLAWHUB_SECRETS_KEY: ${CLAWHUB_SECRETS_KEY:-}
      CLAWHUB_PUBLIC_URL: ${CLAWHUB_PUBLIC_URL:-http://localhost:3000}
      CLAWHUB_DASHBOARD_URL: ${CLAWHUB_DASHBOARD_URL:-http://localhost:3001}
      CLAWHUB_API_RATE_LIMIT: ${CLAWHUB_API_RATE_LIMIT:-100}
      CLAWHUB_GIT_RATE_LIMIT: ${CLAWHUB_GIT_RATE_LIMIT:-240}
      # Platform-admin allowlist (comma-separated emails) gating /api/v1/admin/*,
      # the global cost board, and fleet-wide quality actions. Empty = no admins.
      CLAWHUB_ADMIN_EMAILS: ${CLAWHUB_ADMIN_EMAILS:-}
      # Agent IDs the bundled CI/standing-agent runner may impersonate when pulling
      # a standing run's sealed secrets (the runner is neither the owning agent nor
      # an interactive operator). Comma-separated agent UUIDs. Empty = none.
      CLAWHUB_RUNNER_AGENT_IDS: ${CLAWHUB_RUNNER_AGENT_IDS:-}
      # Capability-graded CI: repos allowed to run privileged CI (host/deploy/build)
      # instead of the default contained sandbox. Read ONLY here in the API process —
      # a tenant can't self-grant. Empty ⇒ nobody gets host (all CI runs contained).
      # MUST be set to the self-deploy repo or the deploy pipeline sandboxes itself.
      CLAWHUB_CI_HOST_EXEC_REPOS: ${CLAWHUB_CI_HOST_EXEC_REPOS:-}
      # Platform-LLM metering gateway (M3). The real platform key is read ONLY
      # here in the API process — it is injected into upstream Anthropic calls and
      # NEVER handed to a container (which gets a per-run gateway token instead).
      # Empty ⇒ the gateway returns 503 and no platform-keyed feature can run.
      CLAWHUB_PLATFORM_ANTHROPIC_KEY: ${CLAWHUB_PLATFORM_ANTHROPIC_KEY:-}
      # Optional: override the Anthropic upstream + per-model prices (JSON) + the
      # gateway's dedicated rate bucket (calls/min/IP — a streaming reviewer makes
      # many). NB: also add a Cloudflare edge rate-limit EXEMPTION for /api/v1/llm/*.
      CLAWHUB_ANTHROPIC_UPSTREAM: ${CLAWHUB_ANTHROPIC_UPSTREAM:-}
      CLAWHUB_PLATFORM_MODEL_PRICES: ${CLAWHUB_PLATFORM_MODEL_PRICES:-}
      CLAWHUB_LLM_RATE_LIMIT: ${CLAWHUB_LLM_RATE_LIMIT:-6000}
      # Open-model routing (D8): set PROVIDER=openrouter + a key to run the platform
      # reviewer/verify on US-pinned open models. The key is read ONLY here in the
      # API process; the gateway forces the US-host pin so no container can widen it.
      CLAWHUB_PLATFORM_PROVIDER: ${CLAWHUB_PLATFORM_PROVIDER:-}
      CLAWHUB_PLATFORM_OPENAI_KEY: ${CLAWHUB_PLATFORM_OPENAI_KEY:-}
      CLAWHUB_PLATFORM_OPENAI_BASE_URL: ${CLAWHUB_PLATFORM_OPENAI_BASE_URL:-}
      CLAWHUB_PLATFORM_MODEL_FAST: ${CLAWHUB_PLATFORM_MODEL_FAST:-}
      CLAWHUB_PLATFORM_MODEL_BALANCED: ${CLAWHUB_PLATFORM_MODEL_BALANCED:-}
      CLAWHUB_PLATFORM_MODEL_FRONTIER: ${CLAWHUB_PLATFORM_MODEL_FRONTIER:-}
      CLAWHUB_PLATFORM_OPENAI_CATALOG: ${CLAWHUB_PLATFORM_OPENAI_CATALOG:-}
      # D10 spend caps: global hard ceiling ($, under the prepaid wall), per-request
      # input ceiling, the auto-created Loop budget default, + the platform-verify flag.
      CLAWHUB_PLATFORM_GLOBAL_MONTHLY_CAP: ${CLAWHUB_PLATFORM_GLOBAL_MONTHLY_CAP:-100}
      CLAWHUB_PLATFORM_MAX_INPUT_TOKENS: ${CLAWHUB_PLATFORM_MAX_INPUT_TOKENS:-}
      CLAWHUB_LOOP_BUDGET_DEFAULT_USD: ${CLAWHUB_LOOP_BUDGET_DEFAULT_USD:-}
      CLAWHUB_PLATFORM_VERIFY_ENABLED: ${CLAWHUB_PLATFORM_VERIFY_ENABLED:-}
      # Kill switch for the M1 deterministic focus-floor synthesis (=1 disables it).
      CLAWHUB_DISABLE_FOCUS_SYNTHESIS: ${CLAWHUB_DISABLE_FOCUS_SYNTHESIS:-}
      # Native advisory reviewer (M4) master flag + platform billing (M7). The
      # reviewer ships DARK; set =1 to enable platform-wide (per-repo opt-out still
      # applies). Stripe keys power the metered-billing reporter (no-op if unset).
      CLAWHUB_NATIVE_REVIEWER_ENABLED: ${CLAWHUB_NATIVE_REVIEWER_ENABLED:-}
      CLAWHUB_STRICT_CLAIMS: ${CLAWHUB_STRICT_CLAIMS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Stripe Price IDs for checkout (M7): the Pro seat price + the metered
      # review-overage / verify prices attached to the subscription. Empty ⇒
      # checkout 503s; the metered reporter still stamps SKUs but sends nothing.
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_REVIEW_OVERAGE: ${STRIPE_PRICE_REVIEW_OVERAGE:-}
      STRIPE_PRICE_VERIFY: ${STRIPE_PRICE_VERIFY:-}
      # OAuth sign-in — providers activate only when their pair is set.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GIT_REPOS_BASE_PATH: /data/repos
      # Hardcoded: this is the production compose file (dev uses
      # docker-compose.dev.yml). A stale .env carrying NODE_ENV=development
      # once disabled the weak-JWT boot refusal in prod — never again.
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - git_repos:/data/repos
    restart: unless-stopped
    # CPU priority: the critical services keep the default 1024 CPU weight while the
    # runner's CI/agent containers run at 256 (CLAWHUB_RUNNER_CPU_SHARES) — so async work
    # yields to the API under contention and can never starve it on a shared box.
    cpu_shares: 1024
    # Give in-flight LLM-gateway streams (and other requests) time to drain on
    # deploy instead of severing them mid-response (M3). Pairs with the process's
    # own SIGTERM handling.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        # Baked into the Next build — rebuild after changing the API URL.
        NEXT_PUBLIC_API_URL: ${CLAWHUB_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_URL: ${CLAWHUB_DASHBOARD_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3001}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
    restart: unless-stopped
    cpu_shares: 1024   # critical UI keeps full CPU weight vs the runner's 256 (see api)
    depends_on:
      - api

  # Public entrypoint with automatic HTTPS. Enable with a real domain:
  #   docker compose --profile proxy up -d
  # Routes <CLAWHUB_DOMAIN> → dashboard and api.<CLAWHUB_DOMAIN> → API + git.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    # Caddy keeps NET_BIND_SERVICE for ports 80/443; everything else dropped.
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLAWHUB_DOMAIN: ${CLAWHUB_DOMAIN:-localhost}
      CLAWHUB_ACME_EMAIL: ${CLAWHUB_ACME_EMAIL:-}
    volumes:
      # CLAWHUB_CADDYFILE selects the edge profile (e.g. Caddyfile.cloudflare
      # when Cloudflare terminates public TLS). Set it in .env so deploys that
      # sync the repo can't swap the active profile out from under you.
      - ${CLAWHUB_CADDYFILE:-./deploy/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api
      - dashboard

  # No host ports: Postgres and Redis are reachable only on the compose
  # network. Exposing them publicly with a known password is how repos leak.
  postgres:
    image: postgres:16-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: clawhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clawhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    security_opt:
      - no-new-privileges:true
    # With REDIS_PASSWORD set, Redis requires AUTH even from inside the
    # compose network — lateral movement from a compromised container stops
    # here. An empty value disables auth (dev default).
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD:-}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  git_repos:
  caddy_data:
  caddy_config:
