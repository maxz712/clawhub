services:
  api:
    build: .
    # Bound to loopback: the Caddy proxy (profile "proxy") is the public face.
    # Without the proxy this still serves http://localhost:3000 for local use.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://clawhub:${POSTGRES_PASSWORD:-clawhub}@postgres:5432/clawhub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CLAWHUB_SECRETS_KEY: ${CLAWHUB_SECRETS_KEY:-}
      CLAWHUB_PUBLIC_URL: ${CLAWHUB_PUBLIC_URL:-http://localhost:3000}
      CLAWHUB_DASHBOARD_URL: ${CLAWHUB_DASHBOARD_URL:-http://localhost:3001}
      CLAWHUB_API_RATE_LIMIT: ${CLAWHUB_API_RATE_LIMIT:-100}
      CLAWHUB_GIT_RATE_LIMIT: ${CLAWHUB_GIT_RATE_LIMIT:-240}
      # OAuth sign-in — providers activate only when their pair is set.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GIT_REPOS_BASE_PATH: /data/repos
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - git_repos:/data/repos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
      args:
        # Baked into the Next build — rebuild after changing the API URL.
        NEXT_PUBLIC_API_URL: ${CLAWHUB_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_URL: ${CLAWHUB_DASHBOARD_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - api

  # Public entrypoint with automatic HTTPS. Enable with a real domain:
  #   docker compose --profile proxy up -d
  # Routes <CLAWHUB_DOMAIN> → dashboard and api.<CLAWHUB_DOMAIN> → API + git.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLAWHUB_DOMAIN: ${CLAWHUB_DOMAIN:-localhost}
      CLAWHUB_ACME_EMAIL: ${CLAWHUB_ACME_EMAIL:-}
    volumes:
      # CLAWHUB_CADDYFILE selects the edge profile (e.g. Caddyfile.cloudflare
      # when Cloudflare terminates public TLS). Set it in .env so deploys that
      # sync the repo can't swap the active profile out from under you.
      - ${CLAWHUB_CADDYFILE:-./deploy/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api
      - dashboard

  # No host ports: Postgres and Redis are reachable only on the compose
  # network. Exposing them publicly with a known password is how repos leak.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clawhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clawhub}
      POSTGRES_DB: clawhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  git_repos:
  caddy_data:
  caddy_config:
