# clawhub e2e verify recipe — TIERED (services/verify-tier.ts picks the cheapest tier
# that proves the diff; the heavy DinD path is the opt-in fallback, not the default).
#
#   docs/test/type-only diff   → static  (no boot; typecheck + affected tests)        seconds
#   dashboard/frontend diff    → app/services (next dev + the api as node processes)  ~minutes
#   api/db diff                → services (the changed processes vs the POOLED        ~minutes
#                                Postgres/Redis + a fresh per-run DB — NO --privileged)
#   docker-compose/Dockerfile  → dind    (the `dind_serve` escape hatch below)        ~15 min
#
# `serve` deliberately contains NO `docker` so the selector never forces dind for a
# normal change; the `services:` block signals tier 2 (the runner injects the pooled
# DATABASE_URL/REDIS_URL). Topology changes use `dind_serve` (full compose).

tier: auto

# Presence ⇒ tier 2. The runner's pooled, pre-migrated Postgres/Redis serve a fresh
# per-run DB (scoped role, dropped on teardown); the URLs arrive as CLAWHUB_DB_URL /
# CLAWHUB_REDIS_URL. No build, no DinD. (Requires CLAWHUB_VERIFY_POOL=1 on the runner;
# without it the services tier falls back to dind_serve.)
services:
  postgres: { image: postgres:16-alpine, schema: "npm -w @clawhub/api run db:push" }
  redis:    { image: redis:7-alpine }

# Tier 1/2 boot: the api + dashboard as plain node processes (tsx/next dev — no image
# build) against the injected pooled DB. Falls back to localhost defaults for a local run.
serve: |
  set -e
  export DATABASE_URL="${CLAWHUB_DB_URL:-postgresql://clawhub:clawhub@localhost:5432/clawhub}"
  export REDIS_URL="${CLAWHUB_REDIS_URL:-redis://localhost:6379}"
  export JWT_SECRET="${JWT_SECRET:-verify-jwt-secret}" CLAWHUB_SECRETS_KEY="${CLAWHUB_SECRETS_KEY:-$(head -c32 /dev/zero | base64)}"
  npm ci --no-audit --no-fund >/tmp/install.log 2>&1 || npm install --no-audit --no-fund >/tmp/install.log 2>&1
  # Build the schema into the per-run DB — FAIL LOUDLY (no `|| true`): a half-built
  # schema must sink the boot, not let the app come up against an empty DB and yield
  # a false 'verified'. Non-interactive (no TTY in the sandbox → drizzle won't prompt).
  npm -w @clawhub/api run db:push >/tmp/dbpush.log 2>&1
  # API on :3000 via direct tsx (NOT `npm run dev`, whose tsx-watch restarts and self-
  # collides → EADDRINUSE). Wait for it healthy BEFORE the dashboard — the readiness
  # poll hits :3001, and a dashboard error page could answer that while the API is down.
  ( cd packages/api && PORT=3000 npx tsx src/index.ts >/tmp/api.log 2>&1 ) &
  for i in $(seq 1 80); do curl -sf http://localhost:3000/api/v1/health >/dev/null 2>&1 && break; sleep 3; done
  curl -sf http://localhost:3000/api/v1/health >/dev/null 2>&1 || { echo "API never came up"; tail -20 /tmp/api.log; exit 1; }
  # Dashboard PINNED to :3001 — next dev defaults to 3000 and would collide with the API.
  ( cd packages/dashboard && npx next dev -p 3001 >/tmp/dash.log 2>&1 ) &

# Tier 3 (dind) escape hatch — full compose in a nested daemon. Selected ONLY when a
# change touches stack topology (docker-compose*/Dockerfile/deploy/**), where you must
# rebuild what the diff changed. The runner grants --privileged only for this tier.
dind_serve: |
  set -e
  docker compose -f docker-compose.dev.yml up -d
  for i in $(seq 1 90); do curl -sf http://localhost:3000/api/v1/health >/dev/null 2>&1 && break; sleep 4; done

url: http://localhost:3001

plan: |
  clawhub is running: API at http://localhost:3000 (health /api/v1/health), dashboard UI
  at http://localhost:3001. clawhub-browse is ALREADY LOGGED IN as a fresh throwaway user
  (its token is auto-injected into localStorage), so app routes render the REAL UI — not
  /login. That user's bearer token is in /workspace/.clawhub-verify-user.json (.token) for
  authenticated API calls.

  BASELINE checks FIRST (prove the app boots AND you are authenticated):
    1. curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/health → assert 200
       (report {kind:"api","name":"health 200"}).
    2. clawhub-browse --url http://localhost:3001/feed and screenshot it. You MUST land on the
       authenticated app (the nav + feed render), NOT on /login. A /login screenshot means auth
       failed — that is a FAILURE (report {kind:"ui","name":"authenticated app renders","ok":false}),
       not a pass; on success report {kind:"ui","name":"authenticated app renders"}.

  THEN verify the behavior the diff SPECIFICALLY changes, end to end — THIS is the point of the
  run, do NOT stop at the baseline:
    • Read the diff and identify the changed surface — an API route? a dashboard page/flow? a CLI?
    • SEED what that flow needs, as the throwaway user, via the API: a brand-new user owns nothing,
      so most UI is empty until you create data. Push a tiny repo (git push to refs/for/main with
      a user token), register an agent, open an issue, etc., depending on what the change touches.
    • EXERCISE it for real: curl the changed API endpoint and assert the response; clawhub-browse the
      changed dashboard route, click/fill if it's interactive, and SCREENSHOT THE ACTUAL CHANGED
      SURFACE (not the homepage, not /login); run the affected test suite.
    • Record one check per behavior you actually exercised. The screenshot evidence must show the
      changed feature working, logged in.

  Checks that don't apply: omit them. ok=false ONLY on a real, observed failure.
  END with one line: RESULT_JSON: {"checks":[{"kind":"api","name":"health 200","ok":true}]}
