name: build-harness-amd64
# Native amd64 leg of the multi-arch agent-harness image publish.
#
# WHY this exists: the harness image (verify/develop mode + the coding-agent CLIs +
# Playwright/Chromium) MUST be multi-arch — the fleet has an arm64 runner (OCI) and
# an amd64 runner (debian). scripts/self-deploy.sh rebuilds it INLINE on the deploy
# host, but only for that host's NATIVE arch (arm64) — so the amd64 runner silently
# stayed on a stale image and every platform review ran the old, un-metered path.
# This pipeline closes that gap: it runs on the amd64 runner (runs_on: amd64),
# builds :<sha>-amd64 in a contained rootless-BuildKit sandbox (execution: build —
# no host docker), then fuses the multi-arch :latest from :<sha>-amd64 +
# :<sha>-arm64. The arm64 tag is now published by its OWN parallel CI leg,
# .clawhub/ci/build-harness-arm64.yml (NOT self-deploy — that coupled arm64 to the
# serialized deploy and timed out the fuse when deploys queued). The fuse step polls
# for the sibling tag briefly and fuses only when both exist. Fires on every merge but
# self-filters to harness-source changes (scripts/ci/harness-sources.sh). BOTH legs run
# the fuse; whichever pushes LAST does the write (idempotent — a double-fuse produces
# the same index), so a leg that queues for an hour cannot time the fuse out.
#
# Setup (operator, one-time): auto-registered on merge (mergeLocked → syncRepoPipelines);
# set GHCR_USER/GHCR_TOKEN repo CI secrets, keep both runner agents in
# CLAWHUB_RUNNER_AGENT_IDS. See docs/operations.md.
on: event
event: change.merged
runs_on: amd64
execution: build
# The harness image (Playwright + Chromium + ~8 coding-agent CLIs) takes well over
# the runner's 1800s default: every rebuild was SIGKILLed mid-Dockerfile around step
# 11/25, leaving a truncated log and no error. 90 min is ~2x the observed honest
# build so a slow mirror day still lands.
timeout_sec: 5400
steps:
  - name: build the amd64 harness image
    run: sh scripts/ci/build-harness-arch.sh amd64
  - name: fuse the multi-arch :latest (whichever leg finishes last)
    run: sh scripts/ci/assemble-harness-manifest.sh
