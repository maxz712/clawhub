// gRPC surface for the git-service tier.
//
// The Node router calls these RPCs after authenticating the agent JWT. The
// shard trusts the caller (per-call bearer + the shared service token in
// metadata). Smart HTTP (`info/refs`, `git-{receive,upload}-pack`) stays as
// HTTP — gRPC is a poor fit for the half-duplex pkt-line wire protocol.
syntax = "proto3";

package clawhub.git.v1;

option go_package = "github.com/clawhub/git-service/genproto/git/v1;gitv1";

// One repository identifier. (namespace, name) — the shard resolves it to a
// local path under GIT_REPOS_BASE_PATH.
message Repo {
  string namespace = 1;
  string name = 2;
}

// Init / mirror-clone
message InitRequest { Repo repo = 1; }
message InitResponse {
  string path = 1;
  string backend = 2;   // "libgit2" | "exec"
}

message MirrorCloneRequest {
  Repo repo = 1;
  string from_endpoint = 2; // peer shard's base URL
}
message MirrorCloneResponse { string path = 1; }

// Refs
message ListRefsRequest {
  Repo repo = 1;
  string prefix = 2;   // empty = "refs/"
}
message Ref { string name = 1; string sha = 2; }
message ListRefsResponse { repeated Ref refs = 1; }

message ResolveRefRequest { Repo repo = 1; string ref_name = 2; }
message ResolveRefResponse { string sha = 1; }

message UpdateRefRequest {
  Repo repo = 1;
  string ref_name = 2;
  string old_sha = 3;   // "" or 40 zeros = create-only (no CAS)
  string new_sha = 4;
}
message UpdateRefResponse {}

message DeleteRefRequest { Repo repo = 1; string ref_name = 2; }
message DeleteRefResponse {}

// Server-side merge.
message MergeRequest {
  Repo repo = 1;
  string base_branch = 2;
  string head_commit = 3;
  string author_name = 4;
  string author_email = 5;
  string message = 6;
  enum Method { MERGE = 0; SQUASH = 1; REBASE = 2; }
  Method method = 7;
}
message MergeResponse { string merge_commit = 1; }

// Object replication.
message FetchPackRequest {
  Repo repo = 1;
  repeated string wants = 2;
}
message FetchPackResponse { bytes chunk = 1; }   // streamed

message ApplyPackRequest {
  oneof payload {
    Repo repo = 1;   // first message
    bytes chunk = 2; // subsequent messages
  }
}
message ApplyPackResponse {}

// Health
message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  string shard = 2;
  string backend = 3;
}

service GitService {
  // Repo lifecycle
  rpc Init(InitRequest) returns (InitResponse);
  rpc MirrorClone(MirrorCloneRequest) returns (MirrorCloneResponse);

  // Refs
  rpc ListRefs(ListRefsRequest) returns (ListRefsResponse);
  rpc ResolveRef(ResolveRefRequest) returns (ResolveRefResponse);
  rpc UpdateRef(UpdateRefRequest) returns (UpdateRefResponse);
  rpc DeleteRef(DeleteRefRequest) returns (DeleteRefResponse);

  // Merge
  rpc Merge(MergeRequest) returns (MergeResponse);

  // Pack object replication
  rpc FetchPack(FetchPackRequest) returns (stream FetchPackResponse);
  rpc ApplyPack(stream ApplyPackRequest) returns (ApplyPackResponse);

  // Liveness for the Node-side circuit breaker
  rpc Health(HealthRequest) returns (HealthResponse);
}
